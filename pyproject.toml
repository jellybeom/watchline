[project]
name = "watchline"
version = "0.1.0"
description = "영웅문4 차트 수평선을 관심종목 CSV로 옮겨주는 편집기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.scripts]
watchline = "watchline.ui:main"
watchline-report = "watchline.cli:main"
watchline-hud = "watchline.hud_window:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]